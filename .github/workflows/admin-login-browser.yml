name: Admin login browser regression

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/admin/login/**"
      - "src/features/admin/login-form.tsx"
      - "tests/browser/admin-login.spec.ts"
      - "playwright.login.config.ts"
      - ".github/workflows/admin-login-browser.yml"

permissions:
  contents: read

jobs:
  login-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test login UI without production credentials
        run: npx playwright test --config playwright.login.config.ts
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-login-browser-report
          path: |
            artifacts/login-qa/
            artifacts/login-results/
          retention-days: 7
          if-no-files-found: warn
