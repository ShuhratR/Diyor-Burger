name: Archived cart browser regression
on:
  pull_request:
    branches: [main]
    paths:
      - "src/features/cart/**"
      - "src/features/checkout/**"
      - "src/lib/menu/variant-kind.ts"
      - "tests/browser/cart-unavailable.spec.ts"
      - "playwright.cart.config.ts"
      - ".github/workflows/cart-browser.yml"
permissions:
  contents: read
jobs:
  cart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check stale-cart modal and checkout rejection
        run: npx playwright test --config playwright.cart.config.ts
      - name: Upload failures and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cart-browser-report
          path: |
            artifacts/cart-qa/
            artifacts/cart-qa-results/
          retention-days: 7
          if-no-files-found: warn
